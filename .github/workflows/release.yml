name: Release

# Build Windows + macOS + Linux desktop installers and attach them to a
# GitHub Release whenever a tag of the shape `v*` is pushed. Frontend
# Next.js bundle is built once per platform inside the same job (Tauri's
# `beforeBuildCommand` runs `yarn build:frontend`).
#
# Usage: bump the version in package.json + src-tauri/tauri.conf.json,
# then:
#   git tag v1.2.3 && git push origin v1.2.3

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # universal2 binary (Intel + Apple Silicon)
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04      # .deb + .AppImage
            args: ''
          - platform: windows-latest    # .msi + .exe
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal binary for macOS — installs both arch targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev

      - name: Install frontend deps
        run: yarn install --frozen-lockfile

      - name: Build + publish via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — public key is in tauri.conf.json, private
          # key (encrypted with the password) lives in repo secrets.
          # Tauri refuses to build with an updater pubkey configured but
          # no matching private key available.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Illuminati Proxy Tester ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
